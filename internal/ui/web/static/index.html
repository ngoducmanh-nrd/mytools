<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="mt-token" content="__MT_TOKEN__">
  <title>mt — Trung tâm tool</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>mt</h1>
    <p class="subtitle">Trung tâm tool cá nhân</p>
  </header>

  <main>
    <section id="tools">
      <div class="col-head">
        <h2>Tools</h2>
        <button id="add-tool" title="Thêm tool">+</button>
      </div>
      <div id="tool-list" class="tool-grid"></div>
    </section>

    <section id="install">
      <h2>Cài đặt Tool mới</h2>
      <textarea id="install-source" spellcheck="false"
        placeholder="./testdata/mock-tools/cli-tool&#10;https://…/tool.exe&#10;https://github.com/…/repo.git"></textarea>
      <p id="install-hint">Dán link Git (có chứa app.toml), link file .exe, hoặc đường dẫn thư mục local.</p>
      <button id="install-btn" class="btn">Cài đặt</button>
      <div id="install-status" hidden><span class="spinner"></span><span>Đang cài đặt…</span></div>
      <form id="manual-form" hidden>
        <p id="manual-hint">Repo không có app.toml — điền thông tin để mt tự tạo:</p>
        <div class="manual-row">
          <label for="manual-name">Tên hiển thị</label>
          <input id="manual-name" type="text" placeholder="Ví dụ: Rea">
        </div>
        <div class="manual-row">
          <label for="manual-entry">Lệnh chạy</label>
          <input id="manual-entry" type="text" placeholder="python main.py">
        </div>
        <div class="manual-row manual-check">
          <label><input id="manual-gui" type="checkbox"> Có giao diện GUI không?</label>
        </div>
        <button id="manual-btn" type="button" class="btn">Xác nhận tạo &amp; Cài đặt</button>
      </form>
      <div id="install-log" class="log" hidden></div>
    </section>

    <section id="detail">
      <h2>Chi tiết &amp; Run</h2>
      <div id="detail-body"></div>
      <div id="run-list"></div>
    </section>
  </main>

  <div id="notice" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
